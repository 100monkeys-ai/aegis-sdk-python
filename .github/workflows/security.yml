name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # `|| true` was here and made this job incapable of failing, which is why
      # Security Audit has been green on every run while CI was red. An audit that
      # cannot fail is not a gate; it is a log line. Measured on the resolved
      # runtime tree at the time this was removed: "No known vulnerabilities found"
      # across all 16 packages, so this change makes the gate real without changing
      # its verdict. The only skip is aegis-sdk itself, which is not on PyPI; a skip
      # is not an error unless --strict is passed, and it deliberately is not.
      - run: pip-audit .

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: "python,actions"
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
