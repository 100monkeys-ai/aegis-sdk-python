name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # `|| true` was here and made this job incapable of failing, which is why
      # Security Audit has been green on every run while CI was red. An audit that
      # cannot fail is not a gate; it is a log line. Measured on the resolved
      # runtime tree at the time this was removed: "No known vulnerabilities found"
      # across all 16 packages, so this change makes the gate real without changing
      # its verdict. The only skip is aegis-sdk itself, which is not on PyPI; a skip
      # is not an error unless --strict is passed, and it deliberately is not.
      - run: pip-audit .

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: "python,actions"
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
