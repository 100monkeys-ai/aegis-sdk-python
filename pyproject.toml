[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk"
version = "0.15.0a0"
description = "Python SDK for building AEGIS agents"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [
    { name = "AEGIS Core Team" }
]
keywords = ["aegis", "ai", "agents", "autonomous", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black==26.5.1",
    "mypy==2.3.1",
    "ruff==0.16.9",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://100monkeys.ai"
Documentation = "https://docs.100monkeys.ai"
Repository = "https://github.com/100monkeys-ai/aegis-sdk-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Declared, not inherited. With no `select` here ruff applies its own default rule
# set, and that default is a property of the installed ruff rather than of this
# repository: 0.15.12 defaults to E4/E7/E9/F and 0.16.6 defaults to roughly thirty
# prefixes. The identical tree therefore printed "All checks passed!" under 0.15.12
# and "Found 416 errors." under 0.16.6, and CI's verdict became a function of the
# release calendar. This list is 0.15.12's default set, read back from
# `ruff check --show-settings` under that version rather than from memory, so
# declaring it changes nothing about what is enforced today and stops it moving.
#
# Widening this set is a decision, not a chore: the 0.16 defaults rewrite `__all__`
# ordering and drop typing re-exports in a published SDK. See the backlog row
# "Adopt ruff's wider default rule set in aegis-sdk-python" in the AEGIS
# Architecture workspace.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
